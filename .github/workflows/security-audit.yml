name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --report-format json --report-path=/repo/gitleaks-report.json --exit-code 1

      - name: Upload redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Scan current tree (not Git history)
        if: always()
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --no-git --source=/repo --redact --report-format json --report-path=/repo/gitleaks-current.json --exit-code 1
      - name: Upload redacted current-tree report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-current-tree-report
          path: gitleaks-current.json
          if-no-files-found: ignore
          retention-days: 7

  build-check:
    name: Build and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript check
        run: bun run lint
      - name: Build production
        run: bun run build
