name: Security dependency validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/grpc-js-cve-2026-101916"
      - "fix/hostinger-node24-build-runtime"

permissions:
  contents: read

jobs:
  validate:
    name: Install, typecheck, build and security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (Hostinger compatible)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun (pinned stable version matching bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies from committed lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Security logic tests
        run: bun run test:security
      - name: Supabase/Firebase integration logic tests
        run: bun run test:supabase
      - name: Isolated Edge Functions end-to-end harness
        run: bun run test:staging:harness

      - name: Confirm patched gRPC version
        run: |
          node -e 'const fs=require("node:fs");const path=require("node:path");let d=path.dirname(require.resolve("@grpc/grpc-js"));while(!fs.existsSync(path.join(d,"package.json"))){const parent=path.dirname(d);if(parent===d)throw new Error("grpc-js package.json not found");d=parent;}const v=JSON.parse(fs.readFileSync(path.join(d,"package.json"),"utf8")).version;console.log("@grpc/grpc-js",v);if(v!=="1.14.7")process.exit(1)'

      - name: Verify production Express server serves / and /healthz
        run: |
          PORT=4198 HOST=127.0.0.1 node server.js &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4198/healthz | grep -q '"distReady":true'
          curl -fsSI http://127.0.0.1:4198/ | grep -q '200'

      - name: Ensure lockfile is committed
        run: git diff --exit-code -- bun.lock
